{
  "name": "Verification",
  "on": {
    "pull_request": {},
    "push": { "branches": ["main"] },
    "workflow_dispatch": {}
  },
  "permissions": { "contents": "read" },
  "jobs": {
    "verify": {
      "runs-on": "macos-14",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": { "persist-credentials": false }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": { "node-version": "22.16.0", "cache": "npm" }
        },
        { "name": "Install locked dependencies in clean CI", "run": "npm ci --no-audit --no-fund" },
        { "name": "Tests, production/backend builds and backend typecheck", "run": "npm run ralph:verify" },
        { "name": "Reject production dependency advisories at every severity", "run": "npm audit --omit=dev --audit-level=low" },
        { "name": "Require reviewed production dependency licenses", "run": "npm run release:licenses" }
      ]
    }
  }
}
